# =====================================================================
#  JOB AGENT v9 – Damir Hadžić  ·  ONE file  ·  fully automatic
#
#  Every 5 minutes it searches 15 built-in job sources (no setup needed),
#  filters them against your profile and eligibility, and updates:
#    1. the front page of this repository (job table)
#    2. a web page with search, filters and an "Applied" tick box
#  Once a day it maintains itself: checks job links, fills missing
#  deadlines, removes old jobs, pauses broken sources, and opens a
#  GitHub Issue (= email to you) if anything needs your attention.
#
#  OPTIONAL: add your own links (Google Alerts RSS or any job-board page)
#  under the "Paste" line below – one per line, starting at the same position.
# =====================================================================

name: Job search

env:
  FEEDS: |
        # Paste each new link on its own line under this one:
        https://www.google.com/alerts/feeds/07122033372245260923/15316257510013749821
        https://reliefweb.int/jobs?search=Construction

# ---------------- nothing to edit below this line ----------------

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Search
        id: search
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, sys, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          NOW = datetime.now(timezone.utc); TODAY = NOW.date(); T = TODAY.isoformat()
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          TOKEN = os.environ.get("GH_TOKEN", "")
          MANUAL = os.environ.get("GITHUB_EVENT_NAME", "") in ("workflow_dispatch", "push", "")
          UA = {"User-Agent": "Mozilla/5.0 (job-agent for personal job search; GitHub Actions)"}

          # ---------------- built-in sources (no setup needed) ----------------
          # kind: rss = RSS/Atom feed · html = job-board page (links matching the pattern are read)
          SOURCES = [
              ("ReliefWeb · construction", "rss", "https://reliefweb.int/jobs?search=Construction", ""),
              ("ReliefWeb · infrastructure", "rss", "https://reliefweb.int/jobs?search=Infrastructure", ""),
              ("ReliefWeb · shelter", "rss", "https://reliefweb.int/jobs?search=Shelter", ""),
              ("ReliefWeb · architect", "rss", "https://reliefweb.int/jobs?search=Architecture", ""),
              ("ReliefWeb · housing", "rss", "https://reliefweb.int/jobs?search=Housing", ""),
              ("ReliefWeb · engineer", "rss", "https://reliefweb.int/jobs?search=Engineer", ""),
              ("ReliefWeb · Bosnia and Herzegovina", "rss", "https://reliefweb.int/jobs/rss.xml?search=%22Bosnia%20and%20Herzegovina%22", ""),
              ("unvacancies · engineering", "html", "https://unvacancies.org/jobs/function/engineering", r"/jobs/[A-Za-z0-9-]+-\d+/?$"),
              ("unvacancies · UNOPS", "html", "https://unvacancies.org/jobs/organization/unops", r"/jobs/[A-Za-z0-9-]+-\d+/?$"),
              ("unvacancies · UN-Habitat", "html", "https://unvacancies.org/jobs/organization/un-habitat", r"/jobs/[A-Za-z0-9-]+-\d+/?$"),
              ("UNjobs · Bosnia and Herzegovina", "html", "https://unjobs.org/duty_stations/bosnia-and-herzegovina", r"/vacancies/\d+"),
              ("UNjobs · construction", "html", "https://unjobs.org/skills/construction", r"/vacancies/\d+"),
              ("UNjobs · infrastructure projects", "html", "https://unjobs.org/skills/infrastructure-projects", r"/vacancies/\d+"),
              ("UNOPS careers", "html", "https://careers.unops.org/", r"JobDetail/"),
              ("UNICEF · construction", "html", "https://jobs.unicef.org/en-us/search/?search-keyword=construction", r"/job/\d+"),
          ]
          for i, l in enumerate(x.strip().strip("'\",").strip() for x in os.environ.get("FEEDS", "").splitlines()):
              if l.startswith(("http", "test:")): SOURCES.append((f"My link {i}", "auto", l, ""))

          # ---------------- profile ----------------
          GOOD = {
              "construction": 4, "infrastructure": 4, "reconstruction": 4, "rehabilitation": 3, "renovation": 3,
              "architect": 4, "architecture": 3, "civil engineer": 3, "engineer": 2, "engineering": 2,
              "construction manager": 4, "site engineer": 3, "resident engineer": 3, "site supervision": 3,
              "construction supervision": 3, "clerk of works": 3, "technical supervisor": 3, "infrastructure specialist": 4,
              "project manager": 3, "programme manager": 3, "program manager": 3, "project coordinator": 2,
              "programme management": 2, "contract management": 3, "contract manager": 3, "pmp": 2,
              "shelter": 3, "settlements": 2, "housing": 3, "urban": 2, "urban design": 3, "urban planning": 2,
              "heritage": 4, "cultural heritage": 4, "conservation": 2, "restoration": 3, "facilities": 2,
              "building": 2, "schools": 2, "preschool": 3, "health facilities": 2, "wash": 2, "solar": 1,
              "energy efficiency": 2, "fidic": 3, "boq": 2, "bill of quantities": 2, "procurement": 1,
              "eu-funded": 2, "ipa": 2, "donor-funded": 1,
              "inženjer": 3, "inzenjer": 3, "arhitekt": 4, "građevin": 3, "gradjevin": 3, "voditelj projekta": 3,
              "nadzor": 2, "investicij": 2,
              "bosnia": 4, "sarajevo": 4, "bih": 3, "balkans": 2, "western balkans": 3, "croatia": 1, "serbia": 1,
              "montenegro": 1, "ukraine": 1, "europe": 1, "remote": 1, "home-based": 1, "home based": 1,
          }
          STEMS = ("građevin", "gradjevin", "investicij")
          ROLE = [w for w in GOOD if GOOD[w] >= 2 and w not in ("bosnia", "sarajevo", "bih", "balkans", "western balkans", "remote")]
          PENALTY = {"fluency in portuguese": -3, "fluent in portuguese": -3, "spanish is required": -3, "fluency in spanish": -2,
                     "arabic is required": -3, "fluency in arabic": -2, "junior": -1}
          SKIP_TITLE = ["intern", "internship", "driver", "software", "nurse", "accountant", "developer", "cleaner",
                        "guard", "data engineer", "electrical engineer", "mechanic", "finance", "hr ", "human resources"]
          SKIP_TEXT = ["nationals of", "open to nationals", "national consultant", "locally recruited", "local recruitment",
                       "npsa", "national professional officer", "national un volunteer", "tier 1 & 2", "tiers 1 & 2", "niveaux 0"]

          # ---------------- 30 jobs checked on 5 Oct 2026 (merged in, never duplicated) ----------------
          STARTER = [
           ["Senior Programme Manager – National Housing Support Programme","UNOPS for UN-Habitat · Damascus · IICA-3","https://careers.unops.org/careersmarketplace/JobDetail/Senior-Programme-Manager/4692","2026-10-30","High","Apply first. Arabic desirable only. Hardship E, non-family"],
           ["Programme Management Specialist – UN-Habitat Syria","UNOPS · Homs · IICA-2","https://unvacancies.org/jobs/organization/unops","2026-10-30","High","Deadline from listing – confirm"],
           ["Programme and Knowledge Management Advisor","UNOPS for UN-Habitat · Damascus · IICA-2","https://unvacancies.org/jobs/organization/unops","2026-10-30","Medium","Deadline from listing – confirm"],
           ["Contract Management Specialist","UNOPS · Home-based","https://careers.unops.org/","2026-10-14","Medium","Check it isn't local-hire only"],
           ["ETC Construction Coordinator (5 positions)","CTG · DR Congo","https://app.tayohr.io/jobs/detail/vac-74481-etc-construction-coordinator-73167","2026-10-10","High","Check French + nationality rules"],
           ["International Urban Design Lead Expert","UN-Habitat · Remote / Baku · consultancy","https://unvacancies.org/jobs/organization/un-habitat","2026-10-14","Medium","Deadline from listing – confirm"],
           ["Gaza Coordinator","UNOPS · Gaza · P-4","https://unvacancies.org/jobs/organization/unops","2026-10-18","Medium","High-risk post. Deadline from listing"],
           ["Architect / Civil Engineer – Building in Existing Buildings (Req 3412)","STRABAG · Austria","https://jobboerse.strabag.at/job-detail.php?ReqId=3412&language=AT_EN","","High","Check deadline + work permit"],
           ["Shelter and Settlement Coordinator (Shelter, WASH and Infrastructure)","Danish Refugee Council · Beirut","https://unjobs.org/skills/infrastructure-projects","","High","Check deadline"],
           ["Head of Building & IT Infrastructure Department","Council of Europe · Strasbourg","https://talents.coe.int/en_GB/careersmarketplace/JobDetail/Head-of-Building-and-IT-Infrastructure-Department/1565","","Medium","French is a risk"],
           ["Program Director for Europe","Habitat for Humanity · Bratislava","https://habitat.wd12.myworkdayjobs.com/External/job/Bratislava-Slovakia/Program-Director-for-Europe_JR103615-1","","Medium","Stretch role"],
           ["Construction Project Manager – 12-month fixed term","Lidl Ireland · Dublin","https://jobs.lidl.ie/jobs/construction-project-manager-12-month-fixed-term-dublin-24-755402","","Medium","EU work permit needed"],
           ["Consultant – Field Engineer (STRONG)","IOM · Banjul, The Gambia","https://unjobs.org/skills/infrastructure-projects","","Medium","Check deadline"],
           ["WASH & Shelter Coordinator","Save the Children · Field","https://unjobs.org/skills/construction","","Medium","Verify it's still open"],
           ["Emergency WASH Officer (UN Volunteer)","UNICEF / UNV · Kyiv","https://unjobs.org/skills/construction","","Low","Fallback only. Check national vs international UNV"],
           ["Associate Sector Specialist – Railway Infrastructure","EIB · Luxembourg","https://unjobs.org/skills/infrastructure-projects","2026-10-21","Low","EIB usually hires EU nationals"],
           ["Infrastructure Construction & Design Manager","Huawei · Sarajevo","https://www.drjobpro.com/bosnia-and-herzegovina/jobs/infrastructure-construction-design-manager-sarajevo-huawei-serbiahungary-rep-office-MU4J2B2F82PHSNG","2026-12-14","High","Needs stručni ispit (you have it) + civil engineering degree (yours is architecture)"],
           ["Resident Engineer (BiH Tunnels)","Hill International · Bosnia and Herzegovina","https://ba.linkedin.com/jobs/view/resident-engineer-bih-tunnels-at-hill-international-inc-3971174262","","Low","Needs 10 yrs transport + tunnels. Confirm still open. CV to career-tr@hillintl.com"],
           ["Senior Programme Officer, Human Settlements (P-5)","UN-Habitat · Nairobi","https://careers.un.org/jobSearchDescription/284607","2026-11-07","Medium","Stretch: urban planning/finance focus"],
           ["Junior Housing and Urban Development Analyst","UN-Habitat · Montreal · IICA-1","https://unhabitat.org/join-us","2026-10-15","Low","Junior – you're overqualified"],
           ["Housing Policy Analysis and Reporting Specialist","UN-Habitat · Montreal · consultancy","https://unvacancies.org/jobs/organization/un-habitat","2026-10-21","Low","Policy research. Deadline from listing"],
           ["Housing Accessibility Policy and Design Specialist","UN-Habitat · Montreal · consultancy","https://unvacancies.org/jobs/organization/un-habitat","2026-10-21","Medium","Design/architecture angle. Deadline from listing"],
           ["Housing Accessibility Standards Specialist","UN-Habitat · Montreal · consultancy","https://unvacancies.org/jobs/organization/un-habitat","2026-10-21","Medium","Deadline from listing"],
           ["Construction Engineer – UNICEF Côte d'Ivoire (UN Volunteer)","UNV · Korhogo","https://www.impactpool.org/jobs/1239099","2026-10-13","Low","Junior UNV, French. Listings disagree on national vs international"],
           ["Project Officer (Displacement Management)","IOM · Antananarivo · P","https://www.iom.int/Zc8","2026-10-08","Low","Displacement/CCCM focus. French likely"],
           ["National Lead Consultant – Field Implementation, Coordination and QA, EU4People Social Protection","UNICEF · BiH, remote with travel","https://unjobs.org/duty_stations/bosnia-and-herzegovina","2026-10-14","Medium","National consultancy in BiH – eligible. Links to your CSW work"],
           ["National Consultants for Field Implementation, EU4People Social Protection","UNICEF · Sarajevo","https://unjobs.org/duty_stations/bosnia-and-herzegovina","2026-10-14","Low","Social protection, not construction"],
           ["Technical Supervisor (Engineering/Architecture)","UN-Habitat · Niterói, Brazil","https://unvacancies.org/jobs/function/engineering","2026-10-08","Low","Portuguese likely required"],
           ["Director, Europe Sustainable Infrastructure, Energy","EBRD · Warsaw / Kyiv / Belgrade / London","https://www.impactpool.org/jobs/c/jobs-at-ebrd","","Low","Very senior banking role"],
           ["Procurement Advisor","UN-Habitat · Rio de Janeiro","https://unvacancies.org/jobs/organization/un-habitat","2026-10-10","Low","Portuguese likely required"],
          ]
          EXCLUDED = [
           ("OSCE Chief, General Services (S3), Sarajevo", "BiH nationals/residents not eligible"),
           ("UNDP Chief Engineering Specialist (IPSA-11), Libreville", "UNDP internal tiers 0–2 only"),
           ("UNDP Joint Project Coordinator, Sarajevo", "Tier 1 & 2 (UNDP internal) only"),
           ("UNOPS Deputy Project Manager (LICA-10), Freetown", "Locally recruited in Sierra Leone"),
           ("IOM Project Associate (Shelter), Beirut, G-5", "Local General Service post"),
           ("UNDP Project Manager (NPSA-9), Sarajevo", "Closed 1 Oct 2026"),
           ("UNICEF WASH Construction Engineers roster, Indonesia", "National consultancy"),
          ]

          # ---------------- helpers ----------------
          MON = {m: i for i, m in enumerate("jan feb mar apr may jun jul aug sep oct nov dec".split(), 1)}
          def has(w, t):
              return re.search(r"(?<![a-zčćžšđ0-9])" + re.escape(w) + ("" if w.endswith(STEMS) else r"(?![a-z0-9])"), t) is not None
          def points(ti, tx=""):
              t = (ti + " " + tx).lower()
              return sum(p for w, p in GOOD.items() if has(w, t)) + sum(p for w, p in PENALTY.items() if w in t)
          def is_role(ti): return any(has(w, ti.lower()) for w in ROLE)
          def skip(ti, tx):
              t = (ti + " " + tx).lower()
              return any(has(w.strip(), ti.lower()) for w in SKIP_TITLE) or (any(has(w, t) for w in SKIP_TEXT) and not has("bosnia", t))
          def deadline(text):
              t = text.lower()
              lead = r"(?:closing date|deadline|apply by|apply before|closes|end date|rok za prijav[a-z]*|rok)\W{0,8}"
              m = re.search(lead + r"(\d{1,2})[\s\-/]*([a-z]{3})[a-z]*\.?,?[\s\-/]*(20\d\d)", t)
              if m and m[2] in MON: return f"{m[3]}-{MON[m[2]]:02d}-{int(m[1]):02d}"
              m = re.search(lead + r"(?:[a-z]+day,?\s*)?([a-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s*(20\d\d)", t)
              if m and m[1] in MON: return f"{m[3]}-{MON[m[1]]:02d}-{int(m[2]):02d}"
              m = re.search(lead + r"(20\d\d)-(\d\d)-(\d\d)", t)
              if m: return f"{m[1]}-{m[2]}-{m[3]}"
              m = re.search(lead + r"(\d{1,2})\.(\d{1,2})\.(20\d\d)", t)
              if m: return f"{m[3]}-{int(m[2]):02d}-{int(m[1]):02d}"
              m = re.search(r"\b(\d{1,3})\s*d(?:ays?)? left\b", t)
              return (TODAY + timedelta(days=int(m[1]))).isoformat() if m else ""
          def clean(s): return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", s or ""))).strip()
          def norm(s): return re.sub(r"\W+", "", (s or "").lower())
          def same(l): return re.sub(r"^https?://(www\.)?", "", (l or "").split("?")[0].split("#")[0].rstrip("/").lower())
          def key(j): return same(j["link"]) + "|" + norm(j["title"])
          def md(s): return re.sub(r"([\[\]|*_`<>])", r"\\\1", s or "")
          def fit(p): return "High" if p >= 10 else "Medium" if p >= 6 else "Low"

          def get(url, timeout=15):
              if url.startswith("test:"): return Path(url[5:]).read_bytes()
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=timeout).read()

          def parse_feed(raw):
              root, A = ET.fromstring(raw), "{http://www.w3.org/2005/Atom}"
              for it in root.iter("item"):
                  yield clean(it.findtext("title")), (it.findtext("link") or "").strip(), clean(it.findtext("description"))
              for it in root.iter(A + "entry"):
                  el = it.find(A + "link"); link = el.get("href", "") if el is not None else ""
                  m = re.search(r"[?&]url=([^&]+)", link)
                  yield clean(it.findtext(A + "title")), urllib.parse.unquote(m[1]) if m else link, clean(it.findtext(A + "content"))

          def parse_page(raw, base, pattern):
              h = raw.decode("utf-8", "replace")
              found = [(m.start(), m.end(), m[1], clean(m[2])) for m in re.finditer(r'<a\b[^>]*href="([^"]+)"[^>]*>(.*?)</a>', h, re.S | re.I)]
              hits = [f for f in found if (re.search(pattern, f[2]) if pattern else 8 <= len(f[3]) <= 160 and is_role(f[3]))]
              for i, (s, e, href, title) in enumerate(hits):
                  ctx = clean(h[e: hits[i + 1][0] if i + 1 < len(hits) else e + 3000])[:450]
                  if title: yield title, urllib.parse.urljoin(base, html.unescape(href)), ctx

          def read(kind, url, pattern):
              raw = get(url)
              is_html = raw.lstrip()[:200].lower().startswith((b"<!doctype", b"<html")) or b"<body" in raw[:3000].lower()
              if kind == "rss" or (kind == "auto" and not is_html):
                  if is_html: raise ValueError("returned a web page, not an RSS feed (blocked?)")
                  return list(parse_feed(raw))
              return list(parse_page(raw, url, pattern))

          def details(url):  # read a job's own page for deadline + eligibility
              try: return clean(get(url, 10).decode("utf-8", "replace"))[:20000]
              except Exception: return None

          def gh(method, path, data=None):
              if not (TOKEN and REPO): return None
              req = urllib.request.Request("https://api.github.com" + path, method=method,
                    data=json.dumps(data).encode() if data else None,
                    headers={"Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json", **UA})
              try: return json.loads(urllib.request.urlopen(req, timeout=15).read() or b"null")
              except Exception as e: return {"_error": str(getattr(e, "code", e))}

          def issue(title, body):
              if not REPO: return
              open_ = gh("GET", f"/repos/{REPO}/issues?state=open&per_page=100")
              if isinstance(open_, list) and any(i.get("title") == title for i in open_): return
              gh("POST", f"/repos/{REPO}/issues", {"title": title, "body": body})

          # ---------------- self-check ----------------
          SAMPLE = ('<html><body><a href="/jobs/construction-engineer-OPS-11">Construction Engineer</a> UNOPS · Kyiv 12d left'
                    '<a href="/jobs/finance-associate-OPS-12">Finance Associate</a> London'
                    '<a href="/jobs/civil-engineer-FAO-13">Civil Engineer</a> Nationals of Sudan only Rolling</body></html>')
          def selfcheck():
              pg = list(parse_page(SAMPLE.encode(), "https://unvacancies.org/x", SOURCES[7][3]))
              checks = [
                  skip("Civil Engineer", "Open to nationals of Iraq"), not skip("Expert", "International consultant"),
                  not skip("Engineer", "nationals of Bosnia and Herzegovina"), points("Assistant", "Washington website") == 0,
                  not skip("Construction Manager", "a key driver of growth"), points("Diplomirani inženjer građevine", "Sarajevo") >= 7,
                  deadline("Closing date: 30 Oct 2026") == "2026-10-30", deadline("Deadline: October 30, 2026") == "2026-10-30",
                  deadline("Rok za prijavu: 15.11.2026") == "2026-11-15", deadline("Post End date: 12-Oct-2026") == "2026-10-12",
                  deadline("UNOPS · Kyiv 12d left") == (TODAY + timedelta(days=12)).isoformat(),
                  len(pg) == 3 and pg[0][1] == "https://unvacancies.org/jobs/construction-engineer-OPS-11",
                  skip(pg[1][0], pg[1][2]) and skip(pg[2][0], pg[2][2]) and not skip(pg[0][0], pg[0][2]),
                  len({key(dict(title=s[0], link=s[2])) for s in STARTER}) == len(STARTER) == 30,
              ]
              return [i for i, c in enumerate(checks) if not c]
          bad = selfcheck()
          if bad: sys.exit(f"STOP: self-check failed (checks {bad}). Nothing was changed. Send this log to Copilot.")

          # ---------------- load + migrate ----------------
          file = Path("jobs.json")
          try: data = json.loads(file.read_text(encoding="utf-8")) if file.exists() else {}
          except Exception:
              Path("jobs.broken.json").write_bytes(file.read_bytes()); data = {}
          if isinstance(data, list): data = {"jobs": data}                      # v7/v8 format
          meta, jobs = data.get("meta", {}), data.get("jobs", [])
          meta.setdefault("sources", {}); meta.setdefault("since", T)
          for j in jobs:
              j.setdefault("note", ""); j.setdefault("status", "open"); j.setdefault("checked", "")
          seen = {key(j) for j in jobs}
          by_title = {norm(j["title"]): j for j in jobs if j.get("found") == "2026-10-05"}
          for t, i, l, d, f, n in STARTER:                                     # merge + correct the checked list
              j = by_title.get(norm(t))
              if j: j.update(info=i, link=l, deadline=d or j.get("deadline", ""), fit=f, note=n)
              elif key(dict(title=t, link=l)) not in seen:
                  jobs.append(dict(title=t, info=i, link=l, deadline=d, fit=f, note=n, found="2026-10-05", status="open", checked=""))
          seen = {key(j) for j in jobs}; links = {same(j["link"]) for j in jobs}

          # ---------------- search (rotating, polite, self-muting) ----------------
          slot = (NOW.hour * 60 + NOW.minute) // 5
          block = f"{T}T{NOW.hour // 6}"
          log, new, enriched = [], [], 0
          for idx, (name, kind, url, pat) in enumerate(SOURCES):
              s = meta["sources"].setdefault(name, {"last_ok": "", "muted": ""})
              if not MANUAL and (idx % 4 != slot % 4 or s.get("muted") == block): continue
              try: items = read(kind, url, pat)
              except Exception as e:
                  s["muted"] = block; log.append(f"FAILED  {name}  ({str(e)[:80]}) – paused for 6 h"); continue
              s["last_ok"], s["muted"] = T, ""
              n = 0
              for ti, link, tx in items:
                  j = dict(title=ti, link=link)
                  if not ti or key(j) in seen or same(link) in links: continue
                  seen.add(key(j)); links.add(same(link))
                  if not is_role(ti) or skip(ti, tx): continue
                  p, d = points(ti, tx), deadline(tx)
                  if p < 5: continue
                  if not d and enriched < 6:
                      page = details(link); enriched += 1
                      if page:
                          if skip(ti, page[:6000]): continue
                          d = deadline(page)
                  if d and d < T: continue
                  new.append(dict(title=ti, info="via " + name, link=link, deadline=d, fit=fit(p),
                                  note=f"Found automatically ({p} points)", found=T, status="open", checked=T)); n += 1
              log.append(f"OK      {name}  ({len(items)} read, {n} new)")
          jobs = new + jobs
          if not log: log.append("No source was due in this 5-minute slot.")

          # ---------------- daily maintenance ----------------
          warn = []
          if meta.get("maint") != T:
              meta["maint"] = T
              shared = {}
              for j in jobs: shared[same(j["link"])] = shared.get(same(j["link"]), 0) + 1
              todo = sorted([j for j in jobs if j["status"] == "open" and shared[same(j["link"])] == 1 and j["link"].startswith("http")],
                            key=lambda j: j.get("checked", ""))[:15]
              for j in todo:                                                   # dead-link check
                  j["checked"] = T
                  try: get(j["link"], 10)
                  except Exception as e:
                      if getattr(e, "code", 0) in (404, 410):
                          j["status"] = "removed"; j["note"] = f"Posting removed (checked {T})"; continue
                  if not j["deadline"]:
                      page = details(j["link"])
                      if page: j["deadline"] = deadline(page)
              cutoff = (TODAY - timedelta(days=45)).isoformat()                # tidy: forget long-closed jobs
              jobs = [j for j in jobs if not ((j["deadline"] and j["deadline"] < cutoff) or (j["status"] == "removed" and j["checked"] < cutoff))]
              recent = (TODAY - timedelta(days=2)).isoformat()
              if meta["since"] <= recent and not any(v.get("last_ok", "") >= recent for v in meta["sources"].values()):
                  issue("Job agent: no search source has worked for 2 days",
                        "Every built-in source failed. The agent keeps trying every 6 hours.\n\n"
                        "Fix: add a Google Alerts RSS link under FEEDS at the top of `.github/workflows/jobs.yml`.")
              if meta.get("vcheck", "") <= (TODAY - timedelta(days=7)).isoformat():   # weekly: are the GitHub steps current?
                  meta["vcheck"] = T
                  used = {}
                  for wf in Path(".github/workflows").glob("*.y*ml"):
                      for a, v in re.findall(r"uses:\s*actions/([\w-]+)@v(\d+)", wf.read_text(encoding="utf-8")): used[a] = int(v)
                  old = []
                  for a, v in used.items():
                      r = gh("GET", f"/repos/actions/{a}/releases/latest") or {}
                      m = re.match(r"v(\d+)", str(r.get("tag_name", "")))
                      if m and int(m[1]) > v: old.append(f"actions/{a}@v{v} → @v{m[1]}")
                  meta["outdated"] = old
                  if old:
                      issue("Job agent: update needed in jobs.yml",
                            "GitHub released new versions of steps this file uses. Open `.github/workflows/jobs.yml` → pencil icon → change:\n\n"
                            + "\n".join(f"- `{o}`" for o in old) + "\n\nOr ask Copilot for an updated file.")
          if meta.get("outdated"): warn.append("Update needed in jobs.yml: " + ", ".join(meta["outdated"]))
          recent = (TODAY - timedelta(days=2)).isoformat()
          if meta["since"] <= recent and not any(v.get("last_ok", "") >= recent for v in meta["sources"].values()):
              warn.append("No search source has worked for 2 days – add a Google Alerts RSS link under FEEDS")

          # ---------------- web page on/off ----------------
          pages = gh("GET", f"/repos/{REPO}/pages") if REPO else None
          pages_on = isinstance(pages, dict) and pages.get("build_type") == "workflow"
          if REPO and not pages_on:
              warn.append("Web page is off: Settings → Pages → Source: GitHub Actions (the job list on this page still works)")
          if os.environ.get("GITHUB_OUTPUT"):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write(f"pages={'true' if pages_on else 'false'}\n")

          # ---------------- save ----------------
          file.write_text(json.dumps({"meta": meta, "jobs": jobs}, ensure_ascii=False, indent=1), encoding="utf-8")
          def days(j): return (date.fromisoformat(j["deadline"]) - TODAY).days if j["deadline"] else None
          def is_open(j): return j["status"] == "open" and (days(j) is None or days(j) >= 0)
          ORDER = {"High": 0, "Medium": 1, "Low": 2}
          open_ = sorted([j for j in jobs if is_open(j)], key=lambda j: (ORDER.get(j["fit"], 3), days(j) is None, days(j) or 0))
          closed = [j for j in jobs if not is_open(j)]
          FIT = {"High": "🟢 High", "Medium": "🟡 Medium", "Low": "⚪ Low"}
          def row(j):
              d = days(j)
              left = ("removed" if j["status"] == "removed" else "check" if d is None else ("🔴 " if 0 <= d <= 7 else "") + f"{d} days")
              new_ = " 🆕" if (TODAY - date.fromisoformat(j["found"])).days <= 2 else ""
              return (f"| [{md(j['title'])}]({j['link'].replace(' ', '%20').replace(')', '%29')}){new_} | {md(j['info'])} | "
                      f"{j['deadline'] or '–'} | {left} | {FIT.get(j['fit'], j['fit'])} | {md(j['note'])} |")
          H = "| Job | Employer · place | Deadline | Left | Fit | Note |\n|---|---|---|---|---|---|\n"
          web = f"https://{REPO.split('/')[0].lower()}.github.io/{REPO.split('/')[-1]}/" if REPO else "#"
          cnt = {f: sum(1 for j in open_ if j["fit"] == f) for f in ORDER}
          ok_src = sum(1 for v in meta["sources"].values() if v.get("last_ok") == T)
          out = ["# My jobs – Damir Hadžić\n"]
          out += [f"> ⚠️ **{w}**\n" for w in warn]
          out += [f"**{len(open_)} open jobs** (🟢 {cnt['High']} · 🟡 {cnt['Medium']} · ⚪ {cnt['Low']}) · updated {T} · "
                  f"checks every 5 minutes · sources working today: {ok_src} of {len(SOURCES)}"
                  + (f" · 🌐 **[Open the web page]({web})**" if pages_on else "") + "\n",
                  "Sorted by fit, then deadline · 🆕 = found in the last 2 days · 🔴 = 7 days or less left · always confirm the deadline on the official posting\n",
                  H + "\n".join(row(j) for j in open_) + "\n"]
          if closed:
              out.append(f"<details><summary>Closed or removed ({len(closed)})</summary>\n\n" + H + "\n".join(row(j) for j in closed) + "\n\n</details>\n")
          out.append("<details><summary>Checked and excluded</summary>\n\n| Job | Reason |\n|---|---|\n" +
                     "\n".join(f"| {md(a)} | {md(b)} |" for a, b in EXCLUDED) + "\n\n</details>\n")
          out.append("<details><summary>Search sources</summary>\n\n| Source | Last worked |\n|---|---|\n" +
                     "\n".join(f"| {md(n)} | {meta['sources'].get(n, {}).get('last_ok') or 'not yet'} |" for n, *_ in SOURCES) + "\n\n</details>\n")
          Path("README.md").write_text("\n".join(out), encoding="utf-8")

          PAGE = r"""<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="300"><title>My jobs</title><style>
          body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f9;color:#222}header{background:#1c4e80;color:#fff;padding:14px 18px}
          h1{margin:0;font-size:19px}small{opacity:.85}main{padding:12px 18px;max-width:1000px}.w{background:#fde2c8;border-radius:8px;padding:8px 12px;margin-bottom:8px}
          input,select{font:inherit;padding:7px 10px;border:1px solid #c8d1dc;border-radius:6px;margin:0 6px 10px 0}
          .k{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.k div{background:#fff;border-radius:8px;padding:6px 12px;font-size:13px}.k b{font-size:18px;display:block}
          .c{background:#fff;border-radius:8px;padding:11px 13px;margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
          .c .t{flex:1 1 300px}.c a{font-weight:600;color:#1c4e80;text-decoration:none}.m{color:#667;font-size:13px}.nt{color:#8a5a00;font-size:12px}
          .p{font-size:12px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}.High{background:#c6efce}.Medium{background:#fff2cc}.Low{background:#e7e7e7}
          .u{background:#f8cbad;color:#9c0006}.o{background:#e2efda}.v{background:#fff2cc}.n{background:#ffd966}.d{opacity:.5}pre{white-space:pre-wrap;font-size:12px}
          </style></head><body><header><h1>My jobs – Damir Hadžić</h1><small>Last checked __TIME__ · checks every 5 minutes · page reloads itself · always confirm deadlines on the official posting</small></header><main>
          __WARN__<div class="k" id="k"></div>
          <input id="q" placeholder="Search…"><select id="f"><option value="">All fits</option><option>High</option><option>Medium</option><option>Low</option></select>
          <select id="v"><option value="t">To do</option><option value="a">Applied</option><option value="all">All</option></select>
          <div id="l"></div><details><summary class="m">Search log</summary><pre>__LOG__</pre></details></main><script>
          const J=__JOBS__,$=i=>document.getElementById(i),T=new Date().toISOString().slice(0,10),O={High:0,Medium:1,Low:2};
          let st={};try{st=JSON.parse(localStorage.getItem("st"))||{}}catch(e){}
          const k=j=>((j.link||"")+"|"+j.title).toLowerCase(),e=s=>String(s||"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
          const dl=d=>d?Math.round((new Date(d)-new Date(T))/864e5):null,age=d=>(new Date(T)-new Date(d))/864e5;
          const op=j=>j.status!="removed"&&(dl(j.deadline)===null||dl(j.deadline)>=0);
          function r(){const q=$("q").value.toLowerCase(),v=$("v").value,f=$("f").value,open=J.filter(op);
          $("k").innerHTML=[["Open",open.length],["High",open.filter(j=>j.fit=="High").length],["Closing ≤7 days",open.filter(j=>{const d=dl(j.deadline);return d!==null&&d<=7}).length],
          ["New (2 days)",J.filter(j=>age(j.found)<=2).length],["Applied",J.filter(j=>st[k(j)]).length]].map(([a,b])=>`<div><b>${b}</b>${a}</div>`).join("");
          const L=J.filter(j=>(j.title+j.info+(j.note||"")).toLowerCase().includes(q)&&(!f||j.fit==f)).filter(j=>{const a=st[k(j)];
          return v=="all"||(v=="a"?a:!a&&op(j))}).sort((a,b)=>(O[a.fit]??3)-(O[b.fit]??3)||(a.deadline||"9").localeCompare(b.deadline||"9"));
          $("l").innerHTML=L.map(j=>{const d=dl(j.deadline),a=st[k(j)],h=/^https?:/.test(j.link||"");
          const tag=j.status=="removed"?'<span class="p">removed</span>':d===null?'<span class="p v">check deadline</span>':d<0?'<span class="p">closed</span>':`<span class="p ${d<=7?"u":"o"}">${d} days left</span>`;
          return `<div class="c ${a?"d":""}"><div class="t">${h?`<a href="${e(j.link)}" target="_blank" rel="noopener">${e(j.title)}</a>`:e(j.title)}
          ${age(j.found)<=2?'<span class="p n">NEW</span>':""}<div class="m">${e([j.info,j.deadline].filter(Boolean).join(" · "))}</div>${j.note?`<div class="nt">${e(j.note)}</div>`:""}</div>
          <span class="p ${e(j.fit)}">${e(j.fit)}</span>${tag}<label class="m"><input type="checkbox" data-k="${e(k(j))}" ${a?"checked":""}> Applied</label></div>`}).join("")||'<p class="m">Nothing here.</p>'}
          $("l").onchange=x=>{st[x.target.dataset.k]=x.target.checked;localStorage.setItem("st",JSON.stringify(st));r()};$("q").oninput=$("v").onchange=$("f").onchange=r;r();
          </script></body></html>"""
          Path("site").mkdir(exist_ok=True)
          Path("site/index.html").write_text(PAGE.replace("__JOBS__", json.dumps(jobs, ensure_ascii=False).replace("</", "<\\/"))
              .replace("__WARN__", "".join(f'<div class="w">⚠️ {html.escape(w)}</div>' for w in warn))
              .replace("__TIME__", NOW.strftime("%d %b %Y, %H:%M UTC")).replace("__LOG__", html.escape("\n".join(log))), encoding="utf-8")
          log.append(f"\n{len(new)} new jobs · {len(open_)} open · {len(jobs)} stored · web page {'on' if pages_on else 'off'}")
          print("\n".join(log + [f"WARNING: {w}" for w in warn]))
          PY

      - name: Save
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add jobs.json README.md
          git diff --cached --quiet && echo "Nothing changed." && exit 0
          git commit -m "Jobs $(date -u +'%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      - if: steps.search.outputs.pages == 'true'
        uses: actions/configure-pages@v6
      - if: steps.search.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - if: steps.search.outputs.pages == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
